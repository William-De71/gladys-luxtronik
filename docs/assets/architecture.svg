<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
  <title>Architecture of the Luxtronik integration for Gladys Assistant (illustration)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#46505a"/>
    </marker>
  </defs>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="980" y="492" text-anchor="end" font-size="12" fill="#8a949e">illustration</text>

  <!-- Gladys -->
  <rect x="20" y="40" width="230" height="320" rx="14" fill="#eef4fb" stroke="#2979d6" stroke-width="2"/>
  <text x="135" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="#1d5fae">Gladys Assistant</text>
  <g font-size="13.5" fill="#24303c">
    <rect x="38" y="90" width="194" height="34" rx="8" fill="#ffffff" stroke="#bcd3ee"/>
    <text x="135" y="112" text-anchor="middle">Heat pump devices</text>
    <rect x="38" y="132" width="194" height="34" rx="8" fill="#ffffff" stroke="#bcd3ee"/>
    <text x="135" y="154" text-anchor="middle">Energy monitoring</text>
    <rect x="38" y="174" width="194" height="34" rx="8" fill="#ffffff" stroke="#bcd3ee"/>
    <text x="135" y="196" text-anchor="middle">UDP search (4444, 47808)</text>
    <rect x="38" y="216" width="194" height="34" rx="8" fill="#ffffff" stroke="#bcd3ee"/>
    <text x="135" y="238" text-anchor="middle">Scenes: triggers, action</text>
    <rect x="38" y="258" width="194" height="52" rx="8" fill="#ffffff" stroke="#bcd3ee"/>
    <text x="135" y="280" text-anchor="middle">Widgets: overview, curves,</text>
    <text x="135" y="298" text-anchor="middle">energy, log</text>
  </g>

  <!-- Gladys <-> container -->
  <line x1="254" y1="200" x2="356" y2="200" stroke="#46505a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g font-size="11" fill="#46505a" text-anchor="middle">
    <text x="305" y="172">REST</text>
    <text x="305" y="188">/api/integration/v1</text>
    <text x="305" y="222">+ WebSocket</text>
  </g>

  <!-- Container -->
  <rect x="360" y="40" width="270" height="320" rx="14" fill="#f4f6f8" stroke="#46505a" stroke-width="2"/>
  <text x="495" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="#24303c">Integration container</text>
  <g font-size="13.5" fill="#24303c">
    <rect x="378" y="90" width="234" height="34" rx="8" fill="#ffffff" stroke="#cfd6dd"/>
    <text x="495" y="112" text-anchor="middle">Node.js + Gladys SDK</text>
    <rect x="378" y="132" width="234" height="52" rx="8" fill="#ffffff" stroke="#cfd6dd"/>
    <text x="495" y="154" text-anchor="middle">src/app.js, src/hub.js:</text>
    <text x="495" y="172" text-anchor="middle">reading every 30 s to 5 min</text>
    <rect x="378" y="192" width="234" height="52" rx="8" fill="#fff7ec" stroke="#f0b35c"/>
    <text x="495" y="214" text-anchor="middle">src/writes.js: changes off</text>
    <text x="495" y="232" text-anchor="middle">by default, spaced, bounded</text>
    <rect x="378" y="252" width="234" height="52" rx="8" fill="#ffffff" stroke="#cfd6dd"/>
    <text x="495" y="274" text-anchor="middle">/data: heat pumps seen,</text>
    <text x="495" y="292" text-anchor="middle">last error, writes of the day</text>
  </g>
  <text x="495" y="340" text-anchor="middle" font-size="12.5" fill="#6b7580">read-only rootfs, 256 MB, non-root</text>

  <!-- container <-> controller -->
  <line x1="634" y1="200" x2="736" y2="200" stroke="#2e8b57" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g font-size="12.5" fill="#2e8b57" text-anchor="middle">
    <text x="685" y="172">TCP 8889</text>
    <text x="685" y="188">3003 / 3004</text>
    <text x="685" y="222">3002 (writes)</text>
    <text x="685" y="238">one at a time</text>
  </g>

  <!-- Controller -->
  <rect x="740" y="40" width="240" height="320" rx="14" fill="#f0f7f1" stroke="#2e8b57" stroke-width="2"/>
  <text x="860" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="#22703f">Luxtronik 2.0 / 2.1</text>
  <g font-size="13.5" fill="#24303c" text-anchor="middle">
    <text x="860" y="108">Alpha Innotec, Novelan,</text>
    <text x="860" y="126">Siemens, Buderus, Nibe AP,</text>
    <text x="860" y="144">Roth, Elco, Wolf</text>
    <text x="860" y="184">~1 100 parameters</text>
    <text x="860" y="202">~270 calculations</text>
    <text x="860" y="242">parameters kept in EEPROM:</text>
    <text x="860" y="260">every write wears it</text>
    <text x="860" y="300">Ethernet, fixed IP address</text>
  </g>

  <g font-size="13" fill="#46505a">
    <text x="20" y="400">The integration reads the controller directly on the local network: no account, no cloud, nothing leaves the house.</text>
    <text x="20" y="424">The network search is a datagram broadcast by Gladys (a container cannot broadcast on the LAN); the typed address always works.</text>
    <text x="20" y="448">Changes are written only when allowed in the settings; firmware V1.90 / V2.90 is never written to.</text>
  </g>
</svg>
