name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. The **Search and test the heat pumps** button of the configuration often tells where it stops: paste its message below.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.2.1'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → Luxtronik, Supervision tab.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Heat pump
      description: The brand and model of the heat pump, and the firmware of the controller (Service > Information > Software, or the configuration button).
      placeholder: 'Alpha Innotec LWD 50A, firmware V3.90.1'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: Does the controller answer other tools on port 8889? Is it on the same network as Gladys? Are changes allowed in the settings?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Logs tab of the integration page), ideally with the SDK debug logs: add the environment variable `DEBUG=gladys-integration-sdk` to the container, reproduce, then copy the lines.
      render: text
